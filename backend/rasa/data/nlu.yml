version: "3.1"

nlu:
  - intent: greet
    examples: |
      - bonjour
      - salut
      - hello
      - bonsoir
      - hey
      - coucou
      - yo
      - salutations
      - bonne journée
      - bonjour à tous

  - intent: goodbye
    examples: |
      - au revoir
      - bye
      - à bientôt
      - à plus
      - salut
      - ciao
      - adieu
      - bonne journée
      - à plus tard
      - merci au revoir

  - intent: affirm
