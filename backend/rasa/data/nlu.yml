      - pouvez-vous m'aider
      - help
      - que peux-tu faire
      - comment ça marche
      - je suis perdu
      - j'ai une question
      - peux-tu m'aider

  - intent: track_order
    examples: |
      - où est ma commande
      - je veux suivre ma commande
      - statut de ma commande [123456](order_id)
