  - intent: bot_challenge
    examples: |
      - es-tu un bot
      - es-tu humain
      - es-tu un robot
      - parles-tu à un humain
      - suis-je en train de parler à un bot
      - es-tu réel
      - c'est un chatbot
      - es-tu une IA

  - synonym: parfum
    examples: |
      - eau de parfum
      - fragrance
      - senteur
      - essence

  - synonym: commande
    examples: |
      - order
      - achat
      - ordre
      - purchase

  - synonym: livraison
    examples: |
      - shipping
      - expédition
      - envoi
      - delivery

  - regex: order_id
    examples: |
      - \d{6}
      - [A-Z]{3}\d{3}
      - ORD-\d{4}

  - regex: price
    examples: |
      - \d+\s?(FCFA|€|USD|\$)
      - \d+\.\d{2}
